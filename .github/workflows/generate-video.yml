name: Generate narrated manhwa video

on:
  push:
    paths:
      - "input/**"
      - "src/**"
      - "scripts/**"
      - "config.yaml"
      - "requirements.txt"
      - "requirements/**"
      - ".github/workflows/generate-video.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manhwa-video-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Fast feedback: lint and unit tests finish in well under a minute and catch
  # the input/parser regressions that used to only surface after a long render.
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/**/*.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Run unit tests
        run: pytest -q

  render:
    name: Render video
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Chapters are large; README recommends Git LFS. Without this the
          # CBZ arrives as a 130-byte pointer file and extraction fails.
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/**/*.txt

      - name: Install FFmpeg and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Kokoro and Hugging Face model assets
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/huggingface
          key: kokoro-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Validate inputs and render video
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/run_pipeline.py

      - name: Upload rendered MP4
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: narrated-manhwa-video
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14

      # Uploaded even when the run fails before rendering starts, so a missing
      # log is itself a signal that something failed very early.
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-logs
          path: |
            output/pipeline.log
            output/work/**
          if-no-files-found: warn
          retention-days: 7
